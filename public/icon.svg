<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="jibliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B5B"/>
      <stop offset="100%" stop-color="#E03A28"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#jibliGrad)"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Fast Delivery Scooter & Cloche Motif -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Fast Delivery Cloche / Cloche Dome -->
    <path d="M256 120 C200 120 152 160 144 216 L368 216 C360 160 312 120 256 120 Z"/>
    <!-- Cloche handle -->
    <circle cx="256" cy="104" r="16"/>
    <!-- Cloche platter base -->
    <rect x="128" y="222" width="256" height="18" rx="9"/>
    <rect x="156" y="246" width="200" height="8" rx="4" fill-opacity="0.7"/>

    <!-- Speed Lines left -->
    <rect x="80" y="150" width="40" height="8" rx="4" fill-opacity="0.8"/>
    <rect x="60" y="176" width="64" height="8" rx="4" fill-opacity="0.9"/>
    <rect x="90" y="202" width="34" height="8" rx="4" fill-opacity="0.7"/>

    <!-- Algerian Star and Crescent Accent Badge -->
    <circle cx="256" cy="336" r="44" fill="#0A0E1A" fill-opacity="0.25"/>
    <!-- Scooter / Fast Courier Wheel Motif -->
    <path d="M180 340 A36 36 0 1 0 180 340.1" stroke="#FFFFFF" stroke-width="14" fill="none"/>
    <circle cx="180" cy="340" r="12" fill="#FFFFFF"/>

    <path d="M332 340 A36 36 0 1 0 332 340.1" stroke="#FFFFFF" stroke-width="14" fill="none"/>
    <circle cx="332" cy="340" r="12" fill="#FFFFFF"/>

    <!-- Frame connecting wheels -->
    <path d="M180 340 L236 340 L270 290 L320 290 M270 290 L332 340" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Handlebars -->
    <path d="M226 270 L250 270 M238 270 L248 316" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- JIBLI Brand typography in SVG -->
  <text x="256" y="440" font-family="'Cairo', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">JIBLI • جبلي</text>
  <text x="256" y="475" font-family="'Cairo', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle" letter-spacing="1">توصيل فائق السرعة • 58 ولاية</text>
</svg>
